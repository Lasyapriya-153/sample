name: Run Python Script Pipeline
on: [push]
jobs:
    run-script:
       runs-on: ubuntu-latest
       steps:
          - name: Checkout Repository Code
            uses: actions/checkout@v4

          - name: Set up Python
            uses: actions/setup-python@v5
            with:
               python-version: '3.10'
          - name: Execute Script
            run: python Example.py
